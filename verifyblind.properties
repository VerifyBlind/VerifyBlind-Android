# Relay API URL (must end with /)
API_BASE_URL=https://api.verifyblind.com/api/Verify/

# EC2 icin false, local Docker icin true
# true ise sabit http://192.168.1.113:5102/api/Verify/ kullanilir
USE_LOCAL_API=false

# Store URL
STORE_URL=https://play.google.com/store/apps/details?id=com.verifyblind.mobile

# Certificate Pinning YOK (kasitli, 2026-07-08): api.verifyblind.com Cloudflare-proxied; edge
# sertifikasini Cloudflare yonetir ve CA'yi habersiz degistirebilir (bu domain icin CT loglarinda
# Let's Encrypt + Google Trust Services + Sectigo ucu de gorulmus). Cloudflare pinlemeyi resmen
# desteklemiyor (HPKP kaldirildi), OWASP de pin seti uzaktan guncellenemiyorsa onermiyor.
# Sistem trust store'una birakilir; CA degisimi sunucu tarafinda izlenir (bloklamaz, alarm verir).

# Developer Authorization Public Key (RSA CSP Blob, Base64)
# PCR0 imzalarını doğrulamak için kullanılır. deploy.bat tarafından  otomatik güncellenir.
DEVELOPER_PUBLIC_
